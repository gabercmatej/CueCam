<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No remote origins (network is also blocked in main). 'unsafe-eval' + blob: are required by vosk-browser:
         its inline worker's Emscripten embind generates invokers with new Function. Only local code runs here. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' data: blob:; img-src 'self' data: blob:; media-src 'self' data: blob: mediastream:; style-src 'self' 'unsafe-inline'"
    />
    <title>Skillcam Output</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
